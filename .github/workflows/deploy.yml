name: CD - Deploy to Server (No Docker)

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Параметры для SSH-подключения (из ваших секретов)
          host: ${{ secrets.PROXY }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          
          # Скрипт, который будет выполнен на вашем сервере
          script: |
            # Переходим в директорию с проектом
            # Убедитесь, что вы уже клонировали проект в эту папку хотя бы один раз
            cd /home/vboxuser/catty-reminders-app

            echo "Pulling latest code from repository..."
            # Скачиваем последние изменения из ветки 'main'
            git pull origin main

            echo "Installing/updating dependencies..."
            # Устанавливаем зависимости Python
            pip install -r requirements.txt

            echo "Restarting the application..."
            # Убиваем старый процесс приложения (если он запущен)
            # Флаг -f ищет 'app.main' в полной команде процесса
            pkill -f "app.main" || true

            # Запускаем приложение заново в фоновом режиме
            # и сохраняем его вывод в лог-файл
            nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &

            echo "Deployment finished successfully!"
            echo "App should be available at http://app.prafdin.course.prafdin.ru"
