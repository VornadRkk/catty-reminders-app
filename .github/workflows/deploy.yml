name: CD - Deploy to Server

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        CR_PAT: ${{ secrets.Token }}
        USERNAME: vornadrkk  
        IMAGE_NAME: ghcr.io/vornadrkk/catty-reminders-app:lab2 
      with:
        host: course.prafdin.ru
        port: 2424
        username: vboxuser
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: CR_PAT,USERNAME,IMAGE_NAME
        script: |
          sudo systemctl stop catty-reminders.service || true
          sudo systemctl disable catty-reminders.service || true

          echo $CR_PAT | sudo docker login ghcr.io -u $USERNAME --password-stdin
          sudo docker pull $IMAGE_NAME
          sudo docker stop myapp || true
          sudo docker rm myapp || true
          sudo docker run -d \
            --name myapp \
            --restart unless-stopped \
            -p 8181:8181 \
            $IMAGE_NAME
