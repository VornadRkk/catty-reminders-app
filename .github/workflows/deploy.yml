name: CD - Deploy Application

on:
  release:
    types: [published] # Запуск только при публикации нового релиза

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Получение кода из репозитория
    - name: Checkout code
      uses: actions/checkout@v4

    # Шаг 2: Сборка/проверка на GitHub Runner
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies (Build check)
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Шаг 3: Развертывание на сервере
    # Этот шаг подключается к вашему серверу и запускает скрипт deploy.sh,
    # полностью повторяя логику вашего старого webhook-сервера.
    - name: Run deployment script on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROXY }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          echo "Starting deployment..."
          /bin/bash /home/vboxuser/deploy.sh
          echo "Deployment script finished."
