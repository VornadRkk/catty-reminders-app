name: CD - Deploy with Docker Compose

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          CR_PAT: ${{ secrets.Token }}
          USERNAME: vornadrkk
          IMAGE_NAME: ghcr.io/vornadrkk/catty-reminders-app:lab4
        with:
          host: course.prafdin.ru
          port: 2424
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CR_PAT,USERNAME,IMAGE_NAME
          script: |
            cd /home/vboxuser/app
            
            echo $CR_PAT | docker login ghcr.io -u $USERNAME --password-stdin
            
            docker pull $IMAGE_NAME
            docker stop catty-app || true
            docker rm catty-app || true
            docker compose -f docker-compose.yml up -d
            
            docker image prune -f
            
            echo 'Deployment completed'
            docker compose -f docker-compose.yml ps
