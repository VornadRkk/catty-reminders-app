name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VM via SSH and restart systemd service with password
      uses: appleboy/ssh-action@v1.0.3
      continue-on-error: true
      with:
        host: course.prafdin.ru
        port: 2424
        username: vboxuser
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/vboxuser/catty-reminders-app
          git pull origin lab2 || true
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "123" | sudo -S systemctl restart catty-reminders.service
          echo "123" | sudo -S systemctl status catty-reminders.service --no-pager
