name: CD - Deploy to Server (No Docker)

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies (for lint/tests if needed)
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: course.prafdin.ru            # или ${{ secrets.PROXY }}
        port: 2424                       # или ${{ secrets.SSH_PORT }}
        username: vboxuser               # или ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        debug: true                     # Включить debug логи в SSH для диагностики
        script: |
          echo "Starting deployment..."

          cd /home/vboxuser/catty-reminders-app

          echo "Pulling latest code from repository..."
          git pull origin lab2

          echo "Stopping old process (if running)..."
          pkill -f "uvicorn app.main:app" || true
          sleep 2
          while pgrep -f "uvicorn app.main:app" >/dev/null; do
              echo "Waiting for old process to terminate..."
              sleep 1
          done

          echo "Creating virtual environment if not exists..."
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          echo "Activating virtual environment..."
          source venv/bin/activate

          echo "Upgrading pip and installing dependencies..."
          pip install --upgrade pip
          pip install -r requirements.txt

          echo "Starting application..."
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &

          echo "Deployment finished successfully!"
          echo "App should be available at http://app.volkov.course.prafdin.ru"
