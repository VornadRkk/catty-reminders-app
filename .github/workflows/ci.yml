name: CI - Test and Build with Docker Compose

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build docker-compose images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if docker compose exec -T db mysqladmin ping -h localhost -u root -pcatty_password 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            echo "Attempt $i: Waiting for MySQL..."
            sleep 2
          done

      - name: Run unit tests
        run: docker compose exec -T app pytest tests/test_unit.py -v

      - name: Run API tests
        run: docker compose exec -T app pytest tests/test_api.py -v

      - name: Show app logs on failure
        if: failure()
        run: |
          echo "=== Application Logs ==="
          docker compose logs app
          echo "=== Database Logs ==="
          docker compose logs db

      - name: Stop services
        run: docker compose down -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref != 'refs/heads/lab4'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.Token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
