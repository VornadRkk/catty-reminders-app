# Название CI воркфлоу
name: CI - Test and Validate Application

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем зависимости из файла
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Устанавливаем зависимости, нужные для тестов (если их нет в requirements)
          pip install pytest pytest-asyncio httpx uvicorn

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          # Предполагается, что юнит-тесты находятся в файле test_unit.py
          pytest tests/test_unit.py -v

      - name: Run API tests
        env:
          PYTHONPATH: .
        run: |
          echo "Starting server for API tests..."
          # Запускаем веб-сервер uvicorn в фоновом режиме
          uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          APP_PID=$!
          
          # Ждем несколько секунд, чтобы сервер успел запуститься
          sleep 5

          echo "Running API tests..."
          # Запускаем тесты, которые обращаются к запущенному приложению
          # Предполагается, что они в файле test_api.py
          pytest tests/test_api.py -v

          echo "Stopping server..."
          # Останавливаем сервер после тестов, чтобы шаг завершился
          kill $APP_PID
