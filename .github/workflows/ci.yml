name: CI/CD - Docker Compose Deployment

on:
  push:
    branches: [ "multicontainers" ]
  pull_request:
    branches: [ "multicontainers" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx playwright

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Verify imports
        run: |
          python -c "from app.routers import api, login, reminders, root; print('All routers imported successfully')"
          python -c "from app.utils import auth, exceptions, mysql_storage; print('All utils imported successfully')"

      - name: Run unit tests
        run: |
          python -m pytest tests/test_unit.py -v

  build-and-test-compose:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t catty-reminders:latest .
          docker tag catty-reminders:latest catty-reminders:${{ github.sha }}

      - name: Start services with docker-compose
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 10

      - name: Check services status
        run: |
          docker compose -f docker-compose.yml ps

      - name: Run API tests against compose stack
        run: |
          docker compose -f docker-compose.yml exec -T app pytest tests/test_api.py -v || true

      - name: Stop docker-compose services
        if: always()
        run: |
          docker compose -f docker-compose.yml down -v

  docker-push:
    runs-on: ubuntu-latest
    needs: build-and-test-compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/multicontainers'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/multicontainers'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with docker-compose
        run: |
          # Тут твой код развертывания на сервер
          # Например через SSH:
          # ssh user@server "cd /path/to/app && docker compose pull && docker compose up -d"
          echo "Deployment step - configure for your server"
          echo "Command: docker compose -f docker-compose.yml up -d"
