# Название CI воркфлоу
name: Run Python Tests

# Запускать при push в любую ветку или при создании/обновлении Pull Request
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    # Запускать на последней версии Ubuntu
    runs-on: ubuntu-latest

    steps:
    # 1. Клонируем код репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Python (укажите вашу версию)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Устанавливаем зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 4. Запускаем тесты (С ИСПРАВЛЕНИЕМ)
    - name: Run tests with pytest
      # Добавляем корневую папку проекта в PYTHONPATH
      env:
        PYTHONPATH: .
      run: |
        pytest
